name: CI

on:
  push:
    branches: ["main", "develop", "dev/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform report, so one failure does not hide another
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cmake_args: -G Ninja -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang
            os: ubuntu-latest
            cmake_args: -G Ninja -DCMAKE_CXX_COMPILER=clang++
          # Windows builds with the default Visual Studio generator and MSVC
          - name: Windows MSVC
            os: windows-latest
            cmake_args: ""
          - name: macOS Clang
            os: macos-latest
            cmake_args: -G Ninja -DCMAKE_CXX_COMPILER=clang++

    steps:
      - uses: actions/checkout@v4
        with:
          # GoogleTest comes in as a git submodule
          submodules: recursive

      # Without clang-format the format target does nothing and the formatting check below would pass vacuously
      - name: Install clang-format
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.cmake_args }}
          -DCMAKE_BUILD_TYPE=Release
          -DKALMAN_CPP_BUILD_TESTS=ON
          -DKALMAN_CPP_WARNINGS_AS_ERRORS=ON

      # The build runs clang-format over the sources before compiling. --config selects the build type on the
      # multi-config Visual Studio generator used on Windows
      - name: Build
        run: cmake --build build --config Release

      # Formatting is checked on one job only; the others would report the same files
      - name: Check formatting
        if: matrix.name == 'Linux GCC'
        run: git diff --exit-code -- '*.cpp' '*.h'

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      # clang-tidy reads the compile commands that CMake writes, so they must come from a clang build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DKALMAN_CPP_BUILD_TESTS=ON

      - name: Run clang-tidy
        run: clang-tidy -p build -warnings-as-errors='*' library/*/*.cpp tests/*.cpp examples/*.cpp

  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # AddressSanitizer, UndefinedBehaviorSanitizer and, on Linux, LeakSanitizer
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DKALMAN_CPP_BUILD_TESTS=ON
          -DKALMAN_CPP_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
